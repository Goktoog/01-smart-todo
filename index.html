<!DOCTYPE html>
<html lang="tr" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hadi Başlayalım! - Smart Todo App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Arka Plan Animasyon Canvas'ı -->
    <canvas id="bgCanvas"></canvas>

    <main class="app-container">
        <!-- Header & Sağ Üst Tema Değiştirme -->
        <header class="app-header">
            <div class="header-title-container">
                <h1 class="app-title">Hadi Başlayalım!</h1>
                <span id="taskCount" class="task-count-top">0 Görev Kaldı</span>
            </div>
            <button id="themeToggleBtn" type="button" aria-label="Tema Değiştir" class="theme-btn">
                <span class="theme-icon">🌙</span>
            </button>
        </header>

        <!-- Arama Çubuğu -->
        <section class="search-section">
            <input type="text" id="searchInput" placeholder="Görev ara..." autocomplete="off">
        </section>

        <!-- Görev Ekleme Formu -->
        <section class="add-task-section">
            <form id="addTaskForm" class="add-task-form">
                <input type="text" id="taskInput" placeholder="Yeni görev ekle..." required autocomplete="off">
                <button type="submit" class="add-btn">➕</button>
            </form>
        </section>

        <!-- Görev Listesi -->
        <ul id="todolist" class="todo-list"></ul>

        <!-- Filtreler -->
        <footer class="app-footer">
            <div class="filters">
                <button id="filterAll" class="filter-btn active" data-filter="all">Tümü</button>
                <button id="filterActive" class="filter-btn" data-filter="active">Aktif</button>
                <button id="filterCompleted" class="filter-btn" data-filter="completed">Tamamlanan</button>
            </div>
        </footer>
    </main>

    <script type="module" src="js/app.js"></script>
    <footer class="site-footer">
        <p>2026 Smart Todo App</p>
        <div class="footer-divider"></div>
        <div class="footer-socials">
            <!-- GitHub -->
            <a href="https://github.com/Goktoog/" target="_blank" rel="noopener noreferrer" aria-label="GitHub"
                class="social-btn">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                    <path
                        d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z" />
                </svg>
            </a>
            <!-- LinkedIn -->

                aria-label="LinkedIn" class="social-btn">

</body>

</html>
